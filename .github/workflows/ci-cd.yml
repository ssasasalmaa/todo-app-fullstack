name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies & Build
        run: |
          npm install
          # Kalau kamu pakai monorepo/folder terpisah, nanti kita sesuaikan bagian ini

      - name: Run Tests
        run: |
          npm test